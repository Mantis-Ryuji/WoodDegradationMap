[project]
name = "wood-degradation-map"
version = "0.1.0"
description = "Unsupervised wood degradation mapping from near-infrared hyperspectral images"
readme = "README.md"
requires-python = "==3.11.15"

dependencies = [
    "chemomae==0.2.2",
    "h5py>=3.16.0",
    "matplotlib>=3.11.0",
    "numpy>=1.24",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.28.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "spectral>=0.25",
    "tensorboard>=2.21.0",
    "timm>=1.0.27",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm>=4.66.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wood_degradation_map"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
